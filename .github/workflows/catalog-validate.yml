name: Catalog validation

on:
  push:
    branches:
      - main
      - 'catalog-*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate catalog
        run: node validate-catalog.mjs
