name: Catalog validation

on:
  push:
    branches:
      - main
      - 'catalog-*'
      - 'diagnosis-*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate catalog
        run: node validate-catalog.mjs
      - name: Validate inventory state
        run: node validate-inventory.mjs
      - name: Regression-test diagnosis
        run: node test-diagnosis.mjs
      - name: Regression-test installation depth
        run: node test-depth.mjs
      - name: Regression-test Hitachi depth
        run: node test-hitachi-depth.mjs
      - name: Regression-test AQUA depth
        run: node test-aqua-depth.mjs
      - name: Regression-test complete depth catalog
        run: node test-depth-complete.mjs
      - name: Regression-test AQUA priority
        run: node test-aqua-priority.mjs
      - name: Regression-test UI flow
        run: node test-ui-flow.mjs
